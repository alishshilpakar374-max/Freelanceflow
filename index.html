<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Application metadata -->
    <title>FreelanceFlow | Freelance Management</title>
    <meta
      name="description"
      content="FreelanceFlow is a workspace for managing freelance clients, projects, leads, and business activities."
    />

    <!-- Keep the application out of search results -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />

    <!-- Browser appearance -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("freelanceflow-theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;

          if (
            stored === "dark" ||
            ((stored === "system" || !stored) && prefersDark)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
